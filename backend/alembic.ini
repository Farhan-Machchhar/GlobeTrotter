# Alembic Configuration for GlobeTrotter
# Generated for async SQLAlchemy (asyncpg / aiosqlite)

[alembic]
script_location = alembic
prepend_sys_path = .

# Async database URL — overridden by env.py from app.core.config
sqlalchemy.url = sqlite+aiosqlite:///./globetrotter.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
